[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scifi"
version = "0.2.0"
description = "Download scientific PDFs by DOI, PMID, or PMCID from PMC Open Access and Sci-Hub."
requires-python = ">=3.10"
dependencies = ["curl_cffi"]

[project.scripts]
scifi = "scifi.cli:main"

[tool.setuptools]
packages = ["scifi", "scifi.sources"]
